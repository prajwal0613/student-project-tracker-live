
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Project Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <header>
            <h1>Student Project Tracker</h1>
            <h5>By Prajwal Ramatirth</h5>
            <h6>Section: C </h6>
            <p>Track our electronics project ideas.</p>
        </header>

        <section aria-labelledby="form-title">
            <h2 id="form-title">Add or Edit Project</h2>

            <form id="project-form">
                <div>
                    <label for="name">Project Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        maxlength="80"
                    >
                </div>

                <div>
                    <label for="status">Project Status</label>
                    <select id="status" name="status">
                        <option value="Planned">Planned</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <button id="save-button" type="submit">Save Project</button>
                <button id="cancel-button" type="button" hidden>
                    Cancel
                </button>
            </form>

            <p id="message" role="status" aria-live="polite"></p>
        </section>

        <section aria-labelledby="list-title">
            <div class="list-header-row">
                <h2 id="list-title">Your Projects</h2>
            </div>

            <div class="list-controls">
                <div class="search-sort-row">
                    <div class="search-wrapper">
                        <svg class="search-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input
                            type="search"
                            id="search-input"
                            placeholder="Search projects..."
                            aria-label="Search projects"
                        >
                    </div>

                    <div class="sort-wrapper">
                        <label for="sort-select" class="sr-only">Sort by</label>
                        <select id="sort-select" aria-label="Sort projects">
                            <option value="newest">Newest First</option>
                            <option value="oldest">Oldest First</option>
                            <option value="name-asc">Name (A–Z)</option>
                            <option value="name-desc">Name (Z–A)</option>
                        </select>
                    </div>
                </div>

                <div class="filter-pills" role="tablist" aria-label="Filter projects by status">
                    <button type="button" class="filter-pill active" data-filter="All" role="tab" aria-selected="true">
                        <span>All</span>
                        <span class="pill-badge" id="count-all">0</span>
                    </button>
                    <button type="button" class="filter-pill" data-filter="Planned" role="tab" aria-selected="false">
                        <span>Planned</span>
                        <span class="pill-badge" id="count-planned">0</span>
                    </button>
                    <button type="button" class="filter-pill" data-filter="In Progress" role="tab" aria-selected="false">
                        <span>In Progress</span>
                        <span class="pill-badge" id="count-in-progress">0</span>
                    </button>
                    <button type="button" class="filter-pill" data-filter="Completed" role="tab" aria-selected="false">
                        <span>Completed</span>
                        <span class="pill-badge" id="count-completed">0</span>
                    </button>
                </div>
            </div>

            <p id="empty-state">No projects added yet.</p>

            <ul id="project-list"></ul>
        </section>
    </main>
</body>
</html>
